name: Tasks

on: [push, pull_request]

jobs:
  lint-php:
    name: "php: ${{ matrix.php }}"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: [ '8.1', '8.2', '8.3', '8.4', '8.5', '8.6' ]
        include:
          # pluswerk/grumphp-config 10.x does not allow PHP 8.6 (only 11.4.0 does, composer.json allows ^7.2.0 || ^10.1.3)
          - php: '8.6'
            ignorePlatformReqs: '--ignore-platform-req=php+'
    steps:
      - name: Setup PHP with PECL extension
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
      - uses: actions/checkout@v5
      - uses: actions/cache@v3
        with:
          path: ~/.composer/cache/files
          key: ${{ runner.os }}-${{ matrix.php }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.php }}-composer-
      - run: composer install --no-interaction --no-progress ${{ matrix.ignorePlatformReqs }}
      # --ignore-platform-req=php+ may only skip the PHP check of dev dependencies (e.g. pluswerk/grumphp-config)
      - if: matrix.php == '8.6'
        run: composer check-platform-reqs --no-dev
      - run: ./vendor/bin/grumphp run --ansi
